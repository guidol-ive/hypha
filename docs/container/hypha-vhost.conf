<VirtualHost *:8080>
	DocumentRoot /var/www/html
	DirectoryIndex index.php

	# With only two workers (mpm_prefork.conf) an idle keep-alive connection blocks a worker for its whole timeout,
	# so a browser that opens several connections waits seconds for each file (measured 2026-10-27: 7 to 14 s for
	# the scripts of a page with the default of 5 s, still 3 to 4.5 s with 1 s). Without keep-alive a worker is free
	# right after its answer; behind NGINX the connection from the browser stays open at NGINX anyway.
	KeepAlive Off

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined

	<Directory /var/www/html>
		# FileInfo for the RewriteRules, Options for -Indexes in .htaccess.
		AllowOverride FileInfo Options
		Require all granted
	</Directory>

	# Behind NGINX (the usual set-up, see docs/technical/REVERSE_PROXY.md):
	# TLS ends at NGINX, so let Hypha build https:// URLs and Secure cookies,
	# and take the client address from NGINX only. Set RemoteIPInternalProxy
	# to the address NGINX connects from.
	#SetEnv HTTPS on
	# Or follow the proxy: Caddy, and NGINX with proxy_set_header, send X-Forwarded-Proto. Only
	# safe when the port of the container is reachable from the proxy alone.
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
	#RemoteIPHeader X-Real-IP
	#RemoteIPInternalProxy 172.17.0.1

	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Cross-Origin-Opener-Policy "same-origin"
	Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'"

	# Defence in depth next to .htaccess: refuse data/ except the theme files.
	# A <Directory> deny would also block the theme CSS, because access is
	# checked before the rewrite in .htaccess runs.
	<LocationMatch "^/data/(?!themes/)">
		Require all denied
	</LocationMatch>
</VirtualHost>
