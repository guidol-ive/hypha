; PHP settings for Hypha in a container.
; Errors go to the container log, never to the browser. Create a file named DEBUG in the
; web root to make index.php show them in the browser as well.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Uploads of images and files in pages.
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M

; Session cookie hardening; Hypha keeps the login in $_SESSION['hyphaLogin'].
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; APCu, shared by the Apache workers: the cache of anonymous pages (system/core/pagecache.php).
; Full entries are evicted, so a larger site only misses more often.
apc.enabled = 1
apc.shm_size = 32M

expose_php = Off
date.timezone = Europe/Amsterdam
