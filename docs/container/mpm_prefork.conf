# Apache prefork limits for Hypha in a small container.
#
# Each Apache/PHP worker of Hypha uses about 85 MB, mostly for the DOM of data/hypha.xml.
# Apache's defaults start a worker for every concurrent connection; when they no longer fit
# in memory the container swaps and throughput collapses (measured 2026-10-26: 1.2 req/s at
# 4 clients with defaults, 6.9 req/s with this cap, 1 CPU and 256 MB). Size
# MaxRequestWorkers to roughly (memory for Apache) / 100 MB; extra connections then wait in
# the queue instead of exhausting memory.
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 1
	MaxSpareServers 2
	MaxRequestWorkers 2
	MaxConnectionsPerChild 500
</IfModule>
